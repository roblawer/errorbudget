[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roblawer-errorbudget"
version = "0.1.0"
description = "把候选项映射到类别上，算出SLO 的错误预算的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "roblawer" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://roblawer.github.io"
Repository = "https://github.com/roblawer/errorbudget"
Issues = "https://github.com/roblawer/errorbudget/issues"

[project.scripts]
errorbudget = "errorbudget:main"

[tool.setuptools]
py-modules = ["errorbudget"]
